[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isai"
version = "0.1.0"
description = "ISyncAI (ISAI) — Portable Co-Evolutionary Human-Agent Synchronization Kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
isai = "isai.__main__:main"

[tool.setuptools]
packages = ["isai"]

[tool.setuptools.package-dir]
isai = ".isai"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
