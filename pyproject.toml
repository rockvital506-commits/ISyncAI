[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isai"
version = "0.2.5"
description = "ISyncAI (ISAI) — Portable Fractal Symbiosis & Context Synchronization Kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
isai = "isai.__main__:main"

[tool.setuptools]
packages = ["isai"]

[tool.setuptools.package-dir]
isai = ".isai"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "isai_scope: Marks which ISAI hypergraph scopes or edges a cross-test verifies.",
]
