name: DomainAgentKit candidate checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Candidate, inventories and synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD^{tree})"
          python3 -I -S -B research/audit/ci_gate_study.py --tree "$tree"
